# VantaOS Obsidian Calamares sequence.
# This is a first-pass installer config and will be refined after ISO testing.

modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id:     vantaos-profile
  module: packagechooser
  config: packagechooser.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - vantaos-profile
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - packages
  - shellprocess
  - bootloader
  - umount
- show:
  - finished

branding: vantaos
prompt-install: false
