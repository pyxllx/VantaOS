# Profile chooser design for VantaOS 1.0.
# Calamares packagechooser support varies by distro build. If the module
# exposes selections to packages.conf, this file becomes active; otherwise the
# project can still build profile-specific ISOs through build/build-iso.sh.

items:
- id: clean
  name: Clean Install
  description: Essentials only. Browser, files, terminal, settings, updater, resource monitor, networking, Bluetooth, audio, display, storage, and power tools.
  selected: true
  hidden: false
- id: gamer
  name: Gamer
  description: Clean plus Steam, Heroic, Lutris, ProtonUp-Qt, Wine, MangoHud, GameMode, OpenRGB, OBS Studio, Discord, VSCodium, GPU tools, and controller support.
  selected: false
  hidden: false
- id: work
  name: Work
  description: Clean plus LibreOffice, Thunderbird, calendar, notes-ready tools, PDF tooling, screenshot/screen recording, Remmina, printing/scanning, Timeshift, and VSCodium.
  selected: false
  hidden: false

mode: optional
